schema: spec-driven

context: |
  Language: pt
  All artifacts must be written in pt.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Product: sorting-lab, laboratório educacional local para ordenar sequências de inteiros.
  Stack: Python ≥3.11, FastAPI, Uvicorn, pytest, httpx; pacote src/sorting_lab.
  Surfaces: HTTP API com Swagger em /docs, CLI `sorting-lab`, UI HTML/CSS/JS estática servida pelo FastAPI.
  Algorithms: bubble, selection, insertion, merge, quick, heap, tim; method all compara os sete.
  Rules already decided: sem auth, sem banco, sem Docker, sem CI, sem ordem descendente, sem animação de passos.
  Sort: cópia da entrada, ordem crescente, QuickSort com mediana de três, métricas internas (time_ms, comparisons, swaps ou null).
  Input: inteiros (negativo, zero, duplicata ok); [] ok; não-inteiro e n > 10000 falham; UI gera N=20 em [-100, 100] por padrão.
  Server: 127.0.0.1:8000. UI e README em português.

rules:
  proposal:
    - Always state what is out of scope
  specs:
    - Requirements describe observable behavior of API, CLI, UI, or sorting results
    - Put algorithm internals (pivot, counters) in design.md unless they affect a user-visible contract
  tasks:
    - Each task states how to verify completion
    - Land tests in the same group that implements the behavior

operations:
  apply:
    guidance:
      - Do not start apply until the user explicitly asks to implement
      - Run pytest tests/ -v before marking the last verification task done
  archive:
    guidance:
      - Archive only after pytest passes and the user confirms
